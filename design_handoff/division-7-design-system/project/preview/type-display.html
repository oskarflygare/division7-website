<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Gellix';
    src: url('../fonts/GellixRegular.otf') format('opentype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Gellix';
    src: url('../fonts/GellixBoldItalic.otf') format('opentype');
    font-weight: 700;
    font-style: italic;
    font-display: swap;
  }
  @font-face {
    font-family: 'Gellix';
    src: url('../fonts/GellixExtraBoldItalic.otf') format('opentype');
    font-weight: 800;
    font-style: italic;
    font-display: swap;
  }
      * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; font-family: 'Gellix', sans-serif; padding: 28px 28px 20px; }
  .specimen { margin-bottom: 16px; border-bottom: 1px solid #1a1a18; padding-bottom: 14px; }
  .specimen:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .meta { display: flex; gap: 16px; align-items: baseline; margin-bottom: 4px; }
  .tag  { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: #555550; font-family: 'Gellix', sans-serif; }
  .text { font-family: 'Gellix', sans-serif; font-weight: 800; font-style: italic; color: #f5f5f0; text-transform: uppercase; line-height: 1.0; letter-spacing: -0.03em; }
</style>
</head>
<body>
  <div class="specimen">
    <div class="meta"><span class="tag">Display / 112px</span></div>
    <div class="text" style="font-size:68px; line-height:0.95;">DIV 7</div>
  </div>
  <div class="specimen">
    <div class="meta"><span class="tag">H1 / 80px</span></div>
    <div class="text" style="font-size:52px;">New Record Out Now</div>
  </div>
  <div class="specimen">
    <div class="meta"><span class="tag">H2 / 64px</span></div>
    <div class="text" style="font-size:40px;">Tour Dates 2025</div>
  </div>
  <div class="specimen">
    <div class="meta"><span class="tag">H3 / 48px</span></div>
    <div class="text" style="font-size:30px;">Pustervik — Gothenburg</div>
  </div>
  <div class="specimen">
    <div class="meta"><span class="tag">H4 / 36px — with accent</span></div>
    <div class="text" style="font-size:22px; color:#e8190e;">Sold Out</div>
  </div>
</body>
</html>
