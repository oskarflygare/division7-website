<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Gellix';
    src: url('../fonts/GellixRegular.otf') format('opentype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Gellix';
    src: url('../fonts/GellixBoldItalic.otf') format('opentype');
    font-weight: 700;
    font-style: italic;
    font-display: swap;
  }
  @font-face {
    font-family: 'Gellix';
    src: url('../fonts/GellixExtraBoldItalic.otf') format('opentype');
    font-weight: 800;
    font-style: italic;
    font-display: swap;
  }
      * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; font-family: 'Gellix', sans-serif; }

  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px; height: 56px;
    border-bottom: 1px solid #1a1a18;
    background: #0a0a0a;
  }
  .nav-logo {
    font-family: 'Gellix', sans-serif; font-weight: 800; font-style: italic;
    font-size: 20px; color: #f5f5f0; letter-spacing: -0.02em; text-transform: uppercase;
    white-space: nowrap;
  }
  .nav-links { display: flex; gap: 32px; align-items: center; }
  .nav-links a {
    font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    color: #888880; text-decoration: none; transition: color 0.15s;
  }
  .nav-links a:hover, .nav-links a.active { color: #f5f5f0; }
  .nav-links a.active { color: #f5f5f0; }
  .nav-cta {
    background: #f5f5f0; color: #0a0a0a;
    font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 9px 18px; border: none; cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .nav-light {
    background: #f5f5f0; border-bottom: 1px solid #d4d4ce; margin-top: 16px;
  }
  .nav-light .nav-logo { color: #0a0a0a; }
  .nav-light .nav-links a { color: #888880; }
  .nav-light .nav-links a:hover { color: #0a0a0a; }
  .nav-light .nav-cta { background: #0a0a0a; color: #f5f5f0; }
</style>
</head>
<body>
  <nav>
    <div class="nav-logo">Division&nbsp;7</div>
    <div class="nav-links">
      <a href="#" class="active">Shows</a>
      <a href="#">Music</a>
      <a href="#">About</a>
      <a href="#">Merch</a>
    </div>
    <button class="nav-cta">Tickets</button>
  </nav>

  <nav class="nav-light">
    <div class="nav-logo">Division&nbsp;7</div>
    <div class="nav-links">
      <a href="#" style="color:#0a0a0a;" class="active">Shows</a>
      <a href="#">Music</a>
      <a href="#">About</a>
      <a href="#">Merch</a>
    </div>
    <button class="nav-cta">Tickets</button>
  </nav>
</body>
</html>
