<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Gellix';
    src: url('../fonts/GellixRegular.otf') format('opentype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Gellix';
    src: url('../fonts/GellixBoldItalic.otf') format('opentype');
    font-weight: 700;
    font-style: italic;
    font-display: swap;
  }
  @font-face {
    font-family: 'Gellix';
    src: url('../fonts/GellixExtraBoldItalic.otf') format('opentype');
    font-weight: 800;
    font-style: italic;
    font-display: swap;
  }
      * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; font-family: 'Gellix', sans-serif; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .label { font-size: 9px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #555550; margin-bottom: 8px; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    font-family: 'Gellix', sans-serif; font-weight: 600; font-size: 12px;
    letter-spacing: 0.1em; text-transform: uppercase;
    padding: 12px 24px; border: none; cursor: pointer;
    transition: opacity 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .btn-primary { background: #f5f5f0; color: #0a0a0a; }
  .btn-primary:hover { background: #e8190e; color: #f5f5f0; }
  .btn-outline { background: transparent; color: #f5f5f0; border: 1px solid #f5f5f0; }
  .btn-outline:hover { background: #f5f5f0; color: #0a0a0a; }
  .btn-accent  { background: #e8190e; color: #f5f5f0; }
  .btn-accent:hover { background: #b81208; }
  .btn-ghost   { background: transparent; color: #888880; border: 1px solid #2a2a28; }
  .btn-ghost:hover { color: #f5f5f0; border-color: #f5f5f0; }
  .btn-sm { padding: 8px 16px; font-size: 11px; }
  .btn-lg { padding: 16px 36px; font-size: 13px; }
  .btn-disabled { opacity: 0.3; cursor: not-allowed; }
</style>
</head>
<body>
  <div>
    <div class="label">Primary — Default / Hover / Disabled</div>
    <div class="row">
      <button class="btn btn-primary">Buy Tickets</button>
      <button class="btn btn-primary" style="background:#e8190e; color:#f5f5f0;">Buy Tickets</button>
      <button class="btn btn-primary btn-disabled">Sold Out</button>
    </div>
  </div>
  <div>
    <div class="label">Outline</div>
    <div class="row">
      <button class="btn btn-outline">Listen Now</button>
      <button class="btn btn-outline" style="background:#f5f5f0; color:#0a0a0a;">Listen Now</button>
    </div>
  </div>
  <div>
    <div class="label">Accent</div>
    <div class="row">
      <button class="btn btn-accent">Sold Out</button>
      <button class="btn btn-ghost">More Info</button>
    </div>
  </div>
  <div>
    <div class="label">Sizes</div>
    <div class="row" style="align-items:center;">
      <button class="btn btn-primary btn-sm">Small</button>
      <button class="btn btn-primary">Default</button>
      <button class="btn btn-primary btn-lg">Large</button>
    </div>
  </div>
</body>
</html>
