<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Gellix';
    src: url('../fonts/GellixRegular.otf') format('opentype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Gellix';
    src: url('../fonts/GellixBoldItalic.otf') format('opentype');
    font-weight: 700;
    font-style: italic;
    font-display: swap;
  }
  @font-face {
    font-family: 'Gellix';
    src: url('../fonts/GellixExtraBoldItalic.otf') format('opentype');
    font-weight: 800;
    font-style: italic;
    font-display: swap;
  }
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; font-family: 'Gellix', sans-serif; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .label { font-size: 9px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #555550; margin-bottom: 8px; }

  .badge {
    display: inline-flex; align-items: center;
    font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 4px 10px;
  }
  .badge-default  { background: #2a2a28; color: #aaaaaa; border: 1px solid #3c3c38; }
  .badge-accent   { background: #e8190e; color: #f5f5f0; }
  .badge-outline  { background: transparent; color: #f5f5f0; border: 1px solid #3c3c38; }
  .badge-soldout  { background: transparent; color: #e8190e; border: 1px solid #e8190e; }
  .badge-white    { background: #f5f5f0; color: #0a0a0a; }
  .badge-new      { background: #0a0a0a; color: #e8190e; border: 1px solid #e8190e; font-size: 9px; padding: 3px 8px; }

  /* Tags / pill-less (sharp) */
  .tag { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #888880; }
  .tag-active { color: #f5f5f0; }
  .tag-accent { color: #e8190e; }

  .divider-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid #1a1a18; }
</style>
</head>
<body>
  <div>
    <div class="label">Badges</div>
    <div class="row">
      <span class="badge badge-default">Upcoming</span>
      <span class="badge badge-accent">Sold Out</span>
      <span class="badge badge-outline">Live</span>
      <span class="badge badge-soldout">Sold Out</span>
      <span class="badge badge-white">New Release</span>
      <span class="badge badge-new">New</span>
    </div>
  </div>
  <div>
    <div class="label">Status Tags</div>
    <div class="row">
      <span class="tag tag-active">Shows</span>
      <span class="tag" style="color:#3c3c38;">·</span>
      <span class="tag">Music</span>
      <span class="tag" style="color:#3c3c38;">·</span>
      <span class="tag">About</span>
      <span class="tag" style="color:#3c3c38;">·</span>
      <span class="tag tag-accent">Tickets</span>
    </div>
  </div>
  <div>
    <div class="label">Inline Label Styles</div>
    <div class="row">
      <span style="font-size:10px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#555550;">Gothenburg</span>
      <span style="color:#3c3c38;">—</span>
      <span style="font-size:10px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#555550;">Nov 15 2025</span>
      <span style="color:#3c3c38;">—</span>
      <span style="font-size:10px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#e8190e;">Sold Out</span>
    </div>
  </div>
</body>
</html>
