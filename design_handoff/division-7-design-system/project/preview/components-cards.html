<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Gellix';
    src: url('../fonts/GellixRegular.otf') format('opentype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Gellix';
    src: url('../fonts/GellixBoldItalic.otf') format('opentype');
    font-weight: 700;
    font-style: italic;
    font-display: swap;
  }
  @font-face {
    font-family: 'Gellix';
    src: url('../fonts/GellixExtraBoldItalic.otf') format('opentype');
    font-weight: 800;
    font-style: italic;
    font-display: swap;
  }
      * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; font-family: 'Gellix', sans-serif; padding: 24px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .label { font-size: 9px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #555550; margin-bottom: 10px; margin-top: 20px; }
  .label:first-child { margin-top: 0; }

  /* Event card */
  .event-card {
    background: #1a1a18; border: 1px solid #2a2a28;
    padding: 20px; width: 200px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .event-date { font-family: 'Gellix', sans-serif; font-weight: 800; font-style: italic; font-size: 28px; color: #f5f5f0; line-height: 1.0; letter-spacing: -0.02em; text-transform: uppercase; }
  .event-venue { font-size: 13px; font-weight: 500; color: #f5f5f0; }
  .event-city  { font-size: 12px; color: #888880; letter-spacing: 0.04em; }
  .event-tag   { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 8px; margin-top: 4px; }
  .tag-soldout { background: #e8190e; color: #f5f5f0; }
  .tag-avail   { background: #2a2a28; color: #aaaaaa; border: 1px solid #3c3c38; }
  .divider { height: 1px; background: #2a2a28; }
  .event-btn {
    background: #f5f5f0; color: #0a0a0a;
    font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 10px 0; text-align: center; cursor: pointer; border: none; width: 100%;
    margin-top: 4px;
  }

  /* Release card */
  .release-card { background: #1a1a18; border: 1px solid #2a2a28; width: 160px; overflow: hidden; }
  .release-art { width: 100%; height: 160px; background: #2a2a28; display: flex; align-items: center; justify-content: center; }
  .release-art-inner { font-family: 'Gellix', sans-serif; font-weight: 800; font-style: italic; font-size: 40px; color: #555550; text-transform: uppercase; letter-spacing: -0.03em; }
  .release-info { padding: 12px; }
  .release-title { font-family: 'Gellix', sans-serif; font-weight: 800; font-style: italic; font-size: 16px; color: #f5f5f0; text-transform: uppercase; letter-spacing: -0.01em; }
  .release-year  { font-size: 11px; color: #555550; margin-top: 3px; }
</style>
</head>
<body>
  <div class="label">Event Cards</div>
  <div class="row">
    <div class="event-card">
      <div class="event-date">15 Nov</div>
      <div class="event-venue">Pustervik</div>
      <div class="event-city">Gothenburg, SE</div>
      <div class="divider"></div>
      <span class="event-tag tag-soldout">Sold Out</span>
    </div>
    <div class="event-card">
      <div class="event-date">22 Nov</div>
      <div class="event-venue">Fållan</div>
      <div class="event-city">Stockholm, SE</div>
      <div class="divider"></div>
      <span class="event-tag tag-avail">Tickets Available</span>
      <button class="event-btn">Buy Tickets</button>
    </div>
    <div class="event-card">
      <div class="event-date">04 Dec</div>
      <div class="event-venue">KB</div>
      <div class="event-city">Malmö, SE</div>
      <div class="divider"></div>
      <span class="event-tag tag-avail">Tickets Available</span>
      <button class="event-btn">Buy Tickets</button>
    </div>
  </div>

  <div class="label">Release Cards</div>
  <div class="row">
    <div class="release-card">
      <div class="release-art"><span class="release-art-inner">D7</span></div>
      <div class="release-info">
        <div class="release-title">Fållan</div>
        <div class="release-year">2024 · LP</div>
      </div>
    </div>
    <div class="release-card">
      <div class="release-art"><span class="release-art-inner">D7</span></div>
      <div class="release-info">
        <div class="release-title">Red Light</div>
        <div class="release-year">2022 · Single</div>
      </div>
    </div>
  </div>
</body>
</html>
